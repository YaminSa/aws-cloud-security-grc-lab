AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Cloud Security Lab - detection and alerting layer.
  SNS email alerts, EventBridge rules for GuardDuty and security tooling tampering,
  and CIS AWS Foundations v3.0 metric filters and alarms on CloudTrail logs.
  Designed to stay within the AWS free tier (6 custom metrics, 6 alarms).

Parameters:
  AlertEmail:
    Type: String
    Description: Email address that receives security alerts
  CloudTrailLogGroupName:
    Type: String
    Default: cloudtrail/cloud-sec-lab
    Description: CloudWatch Logs group that receives CloudTrail events
  MetricNamespace:
    Type: String
    Default: CloudSecLab/CIS

Resources:

  # ---------------------------------------------------------------
  # Alert delivery
  # ---------------------------------------------------------------
  AlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: cloud-sec-lab-alerts
      DisplayName: CloudSecLab Alerts
      Subscription:
        - Protocol: email
          Endpoint: !Ref AlertEmail

  AlertsTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics:
        - !Ref AlertsTopic
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowEventBridgePublish
            Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sns:Publish
            Resource: !Ref AlertsTopic
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
          - Sid: AllowCloudWatchAlarmsPublish
            Effect: Allow
            Principal:
              Service: cloudwatch.amazonaws.com
            Action: sns:Publish
            Resource: !Ref AlertsTopic
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId

  # ---------------------------------------------------------------
  # Real-time EventBridge rules
  # ---------------------------------------------------------------
  GuardDutyHighSeverityRule:
    Type: AWS::Events::Rule
    Properties:
      Name: guardduty-high-critical-findings
      Description: "NIST SI-4(5), IR-6 | GuardDuty findings with severity 7.0 or higher (High and Critical)"
      State: ENABLED
      EventPattern:
        source:
          - aws.guardduty
        detail-type:
          - GuardDuty Finding
        detail:
          severity:
            - numeric: [">=", 7]
      Targets:
        - Id: sns-alerts
          Arn: !Ref AlertsTopic
          InputTransformer:
            InputPathsMap:
              severity: $.detail.severity
              type: $.detail.type
              title: $.detail.title
              region: $.region
              id: $.detail.id
            InputTemplate: '"[GuardDuty] Severity <severity> | <type> | <region> | <title> | Finding ID: <id>"'

  SecurityToolingTamperingRule:
    Type: AWS::Events::Rule
    Properties:
      Name: security-tooling-tampering
      Description: "CIS 4.5, NIST AU-5, AU-9 | Someone stopped, deleted, or changed CloudTrail or GuardDuty"
      State: ENABLED
      EventPattern:
        detail-type:
          - AWS API Call via CloudTrail
        detail:
          eventSource:
            - cloudtrail.amazonaws.com
            - guardduty.amazonaws.com
          eventName:
            - StopLogging
            - DeleteTrail
            - UpdateTrail
            - PutEventSelectors
            - DeleteDetector
            - UpdateDetector
      Targets:
        - Id: sns-alerts
          Arn: !Ref AlertsTopic
          InputTransformer:
            InputPathsMap:
              event: $.detail.eventName
              user: $.detail.userIdentity.arn
              ip: $.detail.sourceIPAddress
              time: $.detail.eventTime
              region: $.region
            InputTemplate: '"[TAMPERING] <event> called by <user> from <ip> at <time> in <region>"'

  # ---------------------------------------------------------------
  # CIS AWS Foundations v3.0 section 4 - metric filters and alarms
  # ---------------------------------------------------------------

  # CIS 4.1 - Unauthorized API calls
  UnauthorizedApiCallsFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref CloudTrailLogGroupName
      FilterName: cis-4-1-unauthorized-api-calls
      FilterPattern: '{ (($.errorCode = "*UnauthorizedOperation") || ($.errorCode = "AccessDenied*")) && ($.sourceIPAddress != "delivery.logs.amazonaws.com") && ($.eventName != "HeadBucket") }'
      MetricTransformations:
        - MetricNamespace: !Ref MetricNamespace
          MetricName: UnauthorizedApiCalls
          MetricValue: "1"

  UnauthorizedApiCallsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: cis-4-1-unauthorized-api-calls
      AlarmDescription: "CIS 4.1, NIST AU-6, SI-4 | 5 or more denied API calls in 5 minutes"
      Namespace: !Ref MetricNamespace
      MetricName: UnauthorizedApiCalls
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertsTopic

  # CIS 4.2 - Console sign-in without MFA
  ConsoleLoginNoMfaFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref CloudTrailLogGroupName
      FilterName: cis-4-2-console-login-no-mfa
      FilterPattern: '{ ($.eventName = "ConsoleLogin") && ($.additionalEventData.MFAUsed != "Yes") && ($.userIdentity.type = "IAMUser") && ($.responseElements.ConsoleLogin = "Success") }'
      MetricTransformations:
        - MetricNamespace: !Ref MetricNamespace
          MetricName: ConsoleLoginNoMfa
          MetricValue: "1"

  ConsoleLoginNoMfaAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: cis-4-2-console-login-no-mfa
      AlarmDescription: "CIS 4.2, NIST IA-2(1) | IAM user signed in to the console without MFA"
      Namespace: !Ref MetricNamespace
      MetricName: ConsoleLoginNoMfa
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertsTopic

  # CIS 4.3 - Root account usage
  RootAccountUsageFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref CloudTrailLogGroupName
      FilterName: cis-4-3-root-account-usage
      FilterPattern: '{ $.userIdentity.type = "Root" && $.userIdentity.invokedBy NOT EXISTS && $.eventType != "AwsServiceEvent" }'
      MetricTransformations:
        - MetricNamespace: !Ref MetricNamespace
          MetricName: RootAccountUsage
          MetricValue: "1"

  RootAccountUsageAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: cis-4-3-root-account-usage
      AlarmDescription: "CIS 4.3, NIST AC-6(9) | The root user performed an action"
      Namespace: !Ref MetricNamespace
      MetricName: RootAccountUsage
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertsTopic

  # CIS 4.4 - IAM policy changes
  IamPolicyChangesFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref CloudTrailLogGroupName
      FilterName: cis-4-4-iam-policy-changes
      FilterPattern: '{ ($.eventName = DeleteGroupPolicy) || ($.eventName = DeleteRolePolicy) || ($.eventName = DeleteUserPolicy) || ($.eventName = PutGroupPolicy) || ($.eventName = PutRolePolicy) || ($.eventName = PutUserPolicy) || ($.eventName = CreatePolicy) || ($.eventName = DeletePolicy) || ($.eventName = CreatePolicyVersion) || ($.eventName = DeletePolicyVersion) || ($.eventName = AttachRolePolicy) || ($.eventName = DetachRolePolicy) || ($.eventName = AttachUserPolicy) || ($.eventName = DetachUserPolicy) || ($.eventName = AttachGroupPolicy) || ($.eventName = DetachGroupPolicy) }'
      MetricTransformations:
        - MetricNamespace: !Ref MetricNamespace
          MetricName: IamPolicyChanges
          MetricValue: "1"

  IamPolicyChangesAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: cis-4-4-iam-policy-changes
      AlarmDescription: "CIS 4.4, NIST AC-2(4), CM-3 | An IAM policy was created, changed, attached, or detached"
      Namespace: !Ref MetricNamespace
      MetricName: IamPolicyChanges
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertsTopic

  # CIS 4.6 - Console authentication failures
  ConsoleAuthFailuresFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref CloudTrailLogGroupName
      FilterName: cis-4-6-console-auth-failures
      FilterPattern: '{ ($.eventName = ConsoleLogin) && ($.errorMessage = "Failed authentication") }'
      MetricTransformations:
        - MetricNamespace: !Ref MetricNamespace
          MetricName: ConsoleAuthFailures
          MetricValue: "1"

  ConsoleAuthFailuresAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: cis-4-6-console-auth-failures
      AlarmDescription: "CIS 4.6, NIST AC-7 | 3 or more failed console sign-ins in 5 minutes"
      Namespace: !Ref MetricNamespace
      MetricName: ConsoleAuthFailures
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 3
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertsTopic

  # CIS 4.10 - Security group changes
  SecurityGroupChangesFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref CloudTrailLogGroupName
      FilterName: cis-4-10-security-group-changes
      FilterPattern: '{ ($.eventName = AuthorizeSecurityGroupIngress) || ($.eventName = AuthorizeSecurityGroupEgress) || ($.eventName = RevokeSecurityGroupIngress) || ($.eventName = RevokeSecurityGroupEgress) || ($.eventName = CreateSecurityGroup) || ($.eventName = DeleteSecurityGroup) }'
      MetricTransformations:
        - MetricNamespace: !Ref MetricNamespace
          MetricName: SecurityGroupChanges
          MetricValue: "1"

  SecurityGroupChangesAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: cis-4-10-security-group-changes
      AlarmDescription: "CIS 4.10, NIST CM-3, SC-7 | A security group was created, deleted, or had its rules changed"
      Namespace: !Ref MetricNamespace
      MetricName: SecurityGroupChanges
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertsTopic

Outputs:
  AlertsTopicArn:
    Description: SNS topic that receives all security alerts
    Value: !Ref AlertsTopic
  GuardDutyRuleName:
    Value: !Ref GuardDutyHighSeverityRule
  TamperingRuleName:
    Value: !Ref SecurityToolingTamperingRule
